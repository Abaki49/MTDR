services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mtdr
      POSTGRES_PASSWORD: mtdr
      POSTGRES_DB: mtdr
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mtdr"]
      interval: 3s
      timeout: 3s
      retries: 5

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://mtdr:mtdr@db:5432/mtdr
      CORS_ORIGINS: '["http://localhost:5173"]'
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
