services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mtdr
      POSTGRES_PASSWORD: mtdr
      POSTGRES_DB: mtdr
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mtdr"]
      interval: 3s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 5

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://mtdr:mtdr@db:5432/mtdr
      CORS_ORIGINS: '["http://localhost:5173"]'
      JWT_SECRET_KEY: dev-secret-key-change-in-production
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
